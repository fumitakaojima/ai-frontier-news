name: MVP static build

on:
  pull_request:
  push:
    branches:
      - main
      - feat/astro-mvp-foundation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check sample content
        run: npm run check:content
      - name: Build static pages
        run: npm run build
