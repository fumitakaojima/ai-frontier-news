<rect x="212" y="120" width="160" height="253" rx="12" fill="url(#panel)"/>
<rect x="387" y="130" width="160" height="253" rx="12" fill="#050a14" opacity=".25" filter="url(#shadow)"/>
<rect x="387" y="120" width="160" height="253" rx="12" fill="url(#panel)"/>
<rect x="562" y="130" width="160" height="253" rx="12" fill="#050a14" opacity=".25" filter="url(#shadow)"/>
<rect x="562" y="120" width="160" height="253" rx="12" fill="url(#panel)"/>
</g>
<g stroke="#a68c9b" stroke-opacity=".35" stroke-width="2"><path d="M60 321H176M235 321H351M410 321H526M585 321H701"/></g>
<g fill="#f1d1be" opacity=".35"><circle cx="117" cy="216" r="70"/><circle cx="292" cy="216" r="70"/><circle cx="467" cy="216" r="70"/><circle cx="642" cy="216" r="70"/></g>
<g fill="url(#shape)" stroke="#f9e4d5" stroke-width="4">
