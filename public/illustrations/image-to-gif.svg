<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="t d">
<title id="t">静止画像からGIFアニメーションへ、複数フレームを示す概念イラスト</title>
<desc id="d">同じ図形が4コマにわたって形と位置を変える過程を描いた編集部制作のイメージ図。画像生成サービスの実際の画面ではありません。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2d1e3e"/><stop offset=".52" stop-color="#51445f"/><stop offset="1" stop-color="#172d48"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#faf1df"/><stop offset="1" stop-color="#d9d6df"/></linearGradient>
<linearGradient id="shape" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffba75"/><stop offset=".55" stop-color="#e87b8d"/><stop offset="1" stop-color="#9a81dc"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="760" height="490" fill="url(#bg)"/>
<g opacity=".22" stroke="#c2b7ec" fill="none">
<circle cx="631" cy="63" r="180"/><circle cx="631" cy="63" r="120"/><path d="M0 419L225 194L456 446L760 153"/>
</g>
<text x="36" y="60" fill="#f8ebef" font-family="Arial,sans-serif" font-size="22" font-weight="bold" letter-spacing="2">IMAGE → MOTION</text>
<rect x="530" y="25" width="189" height="48" rx="24" fill="#ebdbe6" fill-opacity=".16" stroke="#ead9eb" stroke-opacity=".6"/>
<text x="573" y="56" fill="#fff1e2" font-family="Arial,sans-serif" font-size="23" font-weight="bold" letter-spacing="3">GIF</text>
<g>
<rect x="37" y="130" width="160" height="253" rx="12" fill="#050a14" opacity=".25" filter="url(#shadow)"/>
<rect x="37" y="120" width="160" height="253" rx="12" fill="url(#panel)"/>
